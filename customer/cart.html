<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6B00">
  <meta name="description" content="Review your order at Muralidhar Restaurant">
  <title>Cart | Muralidhar Restaurant</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="../shared/images/logo-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared/css/theme.css">
  <link rel="stylesheet" href="css/customer.css">
</head>
<body>
  <div class="cart-page">
    <!-- Cart Header -->
    <header class="cart-header">
      <button class="back-btn" onclick="goBack()" aria-label="Go back to menu">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <div>
        <h1>Your Cart</h1>
        <span class="cart-item-count" id="cartItemCount">0 items</span>
      </div>
    </header>

    <!-- Cart Items -->
    <div class="cart-items" id="cartItems">
      <!-- Items rendered by JavaScript -->
    </div>

    <!-- Empty Cart State -->
    <div class="empty-cart hidden" id="emptyCart">
      <div class="empty-cart-icon">🛒</div>
      <h2>Your cart is empty</h2>
      <p>Add some delicious items from our menu!</p>
      <button class="browse-btn" onclick="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        Browse Menu
      </button>
    </div>

    <!-- Bill Summary -->
    <div class="bill-summary" id="billSummary">
      <h3>Bill Summary</h3>
      <div class="bill-row">
        <span>Subtotal</span>
        <span id="subtotal">₹0.00</span>
      </div>
      <div class="bill-row">
        <span>GST (5%)</span>
        <span id="gst">₹0.00</span>
      </div>
      <div class="bill-row grand-total">
        <span>Grand Total</span>
        <span id="grandTotal">₹0.00</span>
      </div>
    </div>

    <!-- Special Instructions -->
    <div class="special-instructions">
      <label for="specialInstructions">Special Instructions (Optional)</label>
      <textarea 
        id="specialInstructions" 
        placeholder="Any special requests? Less spicy, extra butter, etc."
        maxlength="200"
      ></textarea>
    </div>

    <!-- Cart Actions -->
    <div class="cart-actions">
      <button class="continue-btn" onclick="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        Continue
      </button>
      <button class="place-order-btn" id="placeOrderBtn" onclick="initiateOrder()">
        Place Order
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../shared/js/utils.js"></script>
  <script src="../shared/js/menu-service.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
