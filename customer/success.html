<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00C853">
  <meta name="description" content="Order placed successfully at Muralidhar Restaurant">
  <title>Order Confirmed | Muralidhar Restaurant</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="../shared/images/logo-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared/css/theme.css">
  <link rel="stylesheet" href="css/customer.css">
</head>
<body>
  <div class="success-page" id="successPage">
    <!-- Success Animation -->
    <div class="success-animation">
      <div class="success-circle">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <h1 class="success-title">Order Placed!</h1>
    <p class="success-subtitle">Your delicious food is being prepared</p>

    <!-- Order Details -->
    <div class="order-details" id="orderDetails">
      <div class="detail-row">
        <span class="detail-label">Order Number</span>
        <span class="detail-value highlight" id="orderNumber">#----</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Table Number</span>
        <span class="detail-value" id="tableNumber">--</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Mobile</span>
        <span class="detail-value" id="customerPhone">+91 --------</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Date & Time</span>
        <span class="detail-value" id="orderTime">--</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Total Amount</span>
        <span class="detail-value highlight" id="orderTotal">₹0.00</span>
      </div>

      <!-- Estimated Time -->
      <div class="estimated-time">
        <span class="icon">⏱️</span>
        <div class="text">
          <strong>Estimated Time: 10-15 mins</strong>
          <span>Your order will be served at your table</span>
        </div>
      </div>
    </div>

    <!-- Continue Ordering Button -->
    <button class="continue-ordering-btn" onclick="continueOrdering()">
      Continue Ordering
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-left: 4px;">
        <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
      </svg>
    </button>
  </div>

  <!-- Scripts -->
  <script src="../shared/js/utils.js"></script>
  <script src="js/success.js"></script>
</body>
</html>
