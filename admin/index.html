<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Admin Login | Muralidhar Restaurant</title>

  <!-- Shared Styles -->
  <link rel="stylesheet" href="../shared/css/theme.css">
  <!-- Admin Styles -->
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

  <div class="admin-wrapper">

    <!-- Brand -->
    <div class="admin-brand">
      <div class="brand-icon">🍽️</div>
      <h1 class="brand-title">Muralidhar Restaurant</h1>
      <p class="brand-subtitle">Admin Console</p>
    </div>

    <!-- ============================================
         LOGIN CARD
         ============================================ -->
    <section id="loginCard" class="admin-card">
      <h2 class="card-heading">Sign in</h2>
      <p class="card-subheading">Enter your admin credentials to continue</p>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter username"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >
            <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">👁️</button>
          </div>
        </div>

        <div id="formError" class="form-error hidden"></div>

        <div class="form-options">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe">
            <span>Keep me signed in</span>
          </label>
        </div>

        <button type="submit" id="loginBtn" class="login-btn">
          <span class="btn-label">Login</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </form>

      <p class="demo-hint">Demo credentials: <code>admin</code> / <code>admin123</code></p>
    </section>

    <p class="admin-footer">&copy; <span id="year"></span> Muralidhar Restaurant. All rights reserved.</p>
  </div>

  <!-- Shared Utilities -->
  <script src="../shared/js/utils.js"></script>
  <!-- Admin Logic -->
  <script src="script.js"></script>
</body>
</html>
